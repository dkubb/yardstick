inherit_from: ../.rubocop.yml

# class Foo < Data.define(:a, :b) is preferred over the block form for named
# classes: it produces a proper named class that knows its own name and supports
# inheritance within the class body (e.g. subclasses, include).
Style/DataInheritance:
  Enabled: false

# Avoid parameter lists longer than five parameters.
Metrics/ParameterLists:
  Max: 3
  CountKeywordArgs: true

# Avoid more than `Max` levels of nesting.
Metrics/BlockNesting:
  Max: 3

# Do not force public/protected/private keyword to be indented at the same
# level as the def keyword. My personal preference is to outdent these keywords
# because I think when scanning code it makes it easier to identify the
# sections of code and visually separate them. When the keyword is at the same
# level I think it sort of blends in with the def keywords and makes it harder
# to scan the code and see where the sections are.
Layout/AccessModifierIndentation:
  Enabled: false

# Limit line length
Layout/LineLength:
  Max: 146  # TODO: lower to 79

# Align if/else blocks with the variable assignment
Layout/EndAlignment:
  EnforcedStyleAlignWith: variable

# Allow additional specs
Layout/ExtraSpacing:
  Enabled: false

# Disable documentation checking until a class needs to be documented once
Style/Documentation:
  Enabled: false

# Do not favor modifier if/unless usage when you have a single-line body
Style/IfUnlessModifier:
  Enabled: false

# Do not use sprintf instead of String#%.
Style/FormatString:
  EnforcedStyle: percent

# Not all trivial readers/writers can be defined with attr_* methods
Style/TrivialAccessors:
  Enabled: false

# Don't prefer each_with_object to inject/reduce
Style/EachWithObject:
  Enabled: false

# Allow trailing commas
Style/TrailingCommaInArguments:
  Enabled: false

Style/TrailingCommaInArrayLiteral:
  Enabled: false

Style/TrailingCommaInHashLiteral:
  Enabled: false

# Renaming has_tag? to tag? would be a breaking API change
Naming/PredicatePrefix:
  Enabled: false

# Spec and gemspec blocks are naturally long; so are Rakefile task blocks
Metrics/BlockLength:
  Exclude:
    - 'spec/**/*.rb'
    - '*.gemspec'
    - 'Rakefile'

# Buggy
Lint/FormatParameterMismatch:
  Enabled: false

# We intentionally declare development dependencies in the gemspec
Gemspec/DevelopmentDependencies:
  Enabled: false

# Use square brackets for literal Array objects
Style/PercentLiteralDelimiters:
  PreferredDelimiters:
    '%':  '{}'
    '%i': '[]'
    '%q': ()
    '%Q': ()
    '%r': '{}'
    '%s': ()
    '%w': '[]'
    '%W': '[]'
    '%x': ()
