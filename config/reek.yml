---
detectors:
  Attribute:
    enabled: true
    exclude:
    - Yardstick::Config
    - Yardstick::Rule
    - Yardstick::Document
  BooleanParameter:
    enabled: true
    exclude: []
  ClassVariable:
    enabled: true
    exclude: []
  ControlParameter:
    enabled: true
    exclude:
    # False positive
    - Yardstick::OrderedSet#initialize
  # InstanceVariableAssumption is a new detector in reek 6.x not in original config.
  # Config uses writer methods that set ivars, which reek misreports.
  InstanceVariableAssumption:
    enabled: true
    exclude:
    - Yardstick::Config
  # TooManyConstants is a new detector in reek 6.x not in original config.
  # Decorator defines color/mode codes plus the three constant instances.
  TooManyConstants:
    enabled: true
    exclude:
    - Yardstick::Decorator
  DataClump:
    enabled: true
    exclude: []
    max_copies: 2
    min_clump_size: 2
  DuplicateMethodCall:
    enabled: true
    exclude: []
    max_calls: 1
    allow_calls: []
  FeatureEnvy:
    enabled: true
    exclude: []
  IrresponsibleModule:
    enabled: true
    exclude: []
  LongParameterList:
    enabled: true
    exclude: []
    max_params: 2
    overrides:
      initialize:
        max_params: 3
  LongYieldList:
    enabled: true
    exclude: []
    max_params: 2
  NestedIterators:
    enabled: true
    exclude: []
    max_allowed_nesting: 1
  NilCheck:
    enabled: true
    exclude: []
  RepeatedConditional:
    enabled: true
    exclude: []
    max_ifs: 1
  TooManyInstanceVariables:
    enabled: true
    exclude:
    - Yardstick::Config
    max_instance_variables: 3
  TooManyMethods:
    enabled: true
    exclude:
    - Yardstick::Document
    max_methods: 10
  TooManyStatements:
    enabled: true
    exclude:
    - Yardstick::CLI#self.option_parser
    - Yardstick::CLI#self.parse_config
    - Yardstick::Config#self.normalize_hash
    - Yardstick::Config#defaults=
    - Yardstick::Config#set_defaults
    - Yardstick::Rake::Verify#initialize
    - Yardstick::Rake::Verify#define
    max_statements: 3
  UncommunicativeMethodName:
    enabled: true
    exclude: []
    reject:
    - '/^[a-z]$/'
    - '/[0-9]$/'
    - '/[A-Z]/'
    accept: []
  UncommunicativeModuleName:
    enabled: true
    exclude: []
    reject:
    - '/^.$/'
    - '/[0-9]$/'
    accept: []
  UncommunicativeParameterName:
    enabled: true
    exclude: []
    reject:
    - '/^.$/'
    - '/[0-9]$/'
    - '/[A-Z]/'
    accept: []
  UncommunicativeVariableName:
    enabled: true
    exclude:
    # Ruby convention for rescue variable; rubocop Naming/RescuedExceptionsVariableName requires 'e'
    - Yardstick::CLI#self.parse_config
    reject:
    - '/^.$/'
    - '/[0-9]$/'
    - '/[A-Z]/'
    accept: []
  UnusedParameters:
    enabled: true
    exclude: []
  UtilityFunction:
    enabled: true
    exclude:
    - Yardstick::RuleConfig#initialize
    - Yardstick::Decorator#initialize
